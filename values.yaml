ingressClass:
  enabled: true
  isDefaultClass: false
  name: "traefik"

providers:
  kubernetesIngress:
    enabled: false
    publishedService:
      enabled: true
  kubernetesIngressNGINX:
    enabled: true
    ingressClass: "nginx"
    ingressClassByName: true

service:
  enabled: true
  type: LoadBalancer
